name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          # No GEMINI_API_KEY on purpose — the build and every AI code path must
          # work with no key configured (see ARCHITECTURE.md "AI safety /
          # robustness"), so CI never has one, keeping that guarantee checked on
          # every push instead of just assumed.
          GEMINI_API_KEY: ""
